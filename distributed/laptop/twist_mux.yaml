# Velocity arbitration on the laptop (next to the joystick and the sim).
# Highest priority wins while it is publishing; when it stops for `timeout`
# seconds the next one takes over. Joystick therefore always overrides Nav2.
twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 100
      navigation:
        topic: cmd_vel_smoothed     # output of Nav2's velocity_smoother (Jetson)
        timeout: 0.5
        priority: 10
