# Bridges gz-transport topics <-> ROS 2 topics.
# Ignition Fortress + ros_gz_bridge (Humble). Type strings use gz.msgs.*,
# which the bridge accepts as an alias for ignition.msgs.* on Humble.
#
# Images (camera/left/image, camera/right/image) are NOT here: they go
# through ros_gz_image's image_bridge (see launch_sim.launch.py).
#
# Entries for sensors that are toggled off (right camera in mono mode, GPS
# when enable_gps is false) are harmless: the bridge just never receives
# data on those topics.

# =========================================================
# CLOCK / STATE / ODOMETRY / CONTROL
# =========================================================
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# published by the JointStatePublisher plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# published by the DiffDrive plugin
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# subscribed to by the DiffDrive plugin
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# =========================================================
# STEREO CAMERA PAIR (camera_info only; images via image_bridge)
# =========================================================
- ros_topic_name: "camera/left/camera_info"
  gz_topic_name: "camera/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/right/camera_info"
  gz_topic_name: "camera/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# =========================================================
# IMU
# =========================================================
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# =========================================================
# GPS (only publishes when launched with enable_gps:=true)
# =========================================================
- ros_topic_name: "navsat"
  gz_topic_name: "navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS
